name: Deploy team GHV fraud API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-ghv-cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Explicit opt-in; obtain the deploy identity/provider from the instructor.
    # Coordinate Terraform image ownership before enabling this optional workflow.
    if: ${{ vars.ENABLE_CD == 'true' && vars.IMAGE_OWNER == 'cd' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: advanced-cloud-ai
      REGION: europe-west1
      IMAGE_REPOSITORY: europe-west1-docker.pkg.dev/advanced-cloud-ai/cloud-ai/team-ghv-fraud-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure registry authentication
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish a commit-versioned image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
      - name: Deploy the exact image digest to the existing private service
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gcloud run services update team-ghv-fraud-api \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --service-account=cloudai-runner@advanced-cloud-ai.iam.gserviceaccount.com \
            --quiet
