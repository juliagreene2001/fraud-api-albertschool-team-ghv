name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  features-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.5
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Synthetic feature tests without course data or cloud credentials
        run: uv run --frozen pytest tests/test_features.py -q
      - run: uv run --frozen ruff check .
